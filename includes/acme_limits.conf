limit_req zone=acme_client burst=16 nodelay;
limit_req zone=acme_service burst=60 nodelay;
limit_req zone=acme_registration_client burst=4 nodelay;
limit_req zone=acme_registration_service burst=12 nodelay;
limit_req_status 429;
limit_req_log_level notice;

error_page 429 = @acme_rate_limited;
location @acme_rate_limited {
    default_type application/problem+json;
    add_header Retry-After 10 always;
    add_header Cache-Control no-store always;
    return 429 '{"type":"urn:ietf:params:acme:error:rateLimited","detail":"ACME request rate exceeded","status":429}';
}
