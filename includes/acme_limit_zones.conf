# Empty keys leave ordinary API traffic outside these zones. Constant keys share
# the service-wide budgets across the RMAPI virtual hosts in this instance.
map $uri $acme_client_key {
    default "";
    ~^/api/v1/acme(/|$) $binary_remote_addr;
}
map $uri $acme_service_key {
    default "";
    ~^/api/v1/acme(/|$) rmapi;
}
map "$request_method:$uri" $acme_registration_client_key {
    default "";
    ~^POST:/api/v1/acme/new-account/?$ $binary_remote_addr;
}
map "$request_method:$uri" $acme_registration_service_key {
    default "";
    ~^POST:/api/v1/acme/new-account/?$ rmapi;
}

limit_req_zone $acme_client_key zone=acme_client:1m rate=6r/s;
limit_req_zone $acme_service_key zone=acme_service:1m rate=30r/s;
limit_req_zone $acme_registration_client_key zone=acme_registration_client:1m rate=6r/m;
limit_req_zone $acme_registration_service_key zone=acme_registration_service:1m rate=30r/m;
